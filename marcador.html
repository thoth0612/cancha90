<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcador Cancha 90</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo:#e10600; --negro:#0a0a0a; --blanco:#fff;
    --fuente:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;overflow:hidden;width:1920px;height:1080px;font-family:var(--fuente);}
  #wrap{
    position:absolute;left:48px;top:40px;display:flex;align-items:stretch;gap:0;
    transition:opacity .35s ease, transform .35s ease;
  }
  #wrap.oculto{opacity:0;transform:translateY(-24px)}

  /* Logo */
  .logo{display:flex;align-items:center;padding-right:14px}
  .logo img{height:104px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}

  .cuerpo{display:flex;flex-direction:column}
  .torneo{
    align-self:flex-start;background:var(--rojo);color:#fff;font-weight:800;
    font-size:25px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 20px 0;
    border-radius:10px 10px 0 0;line-height:1.25;white-space:nowrap;
  }
  .barra{display:flex;align-items:stretch;height:72px;background:var(--negro);border-radius:0 12px 12px 12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45)}

  .equipo{display:flex;align-items:center;min-width:300px}
  .equipo.local{justify-content:flex-end}
  .equipo .nombre{
    color:#fff;font-weight:800;font-size:42px;text-transform:uppercase;letter-spacing:1px;
    padding:0 20px;white-space:nowrap;line-height:1;padding-top:3px;
  }
  .chip{width:16px;align-self:stretch;flex:none;border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15)}

  .goles{display:flex;align-items:stretch}
  .gol{
    width:68px;background:#fff;color:var(--negro);font-weight:800;font-size:52px;
    display:flex;align-items:center;justify-content:center;padding-top:3px;
  }
  .gol + .gol{border-left:3px solid var(--negro)}
  .gol.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35);background:#ffe14d}100%{transform:scale(1)}}

  .reloj{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:var(--rojo);color:#fff;min-width:170px;padding:0 18px;
  }
  .reloj .fase{font-weight:700;font-size:21px;letter-spacing:1.5px;text-transform:uppercase;line-height:1;white-space:nowrap}
  .reloj .tiempo{font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;margin-top:3px}
  @media (prefers-reduced-motion:reduce){.gol.pop{animation:none}#wrap{transition:none}}
</style>
</head>

  if(!t) return 0;
  let s = t.base;
  if(t.corriendo){
    const delta = (Date.now() - t.inicio)/1000;
    s = t.cuenta === 'regresiva' ? t.base - delta : t.base + delta;
  }
  if(t.cuenta === 'regresiva') s = Math.max(0, s);
  return Math.max(0, Math.floor(s));
}
function fmt(s){
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}
function pop(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

function pintar(){
  const e = leer();
  if(!e) return;
  $('torneo').textContent = e.torneo;
  $('nL').textContent = e.local.nombre;
  $('nV').textContent = e.visita.nombre;
  $('cL').style.background = e.local.color;
  $('cV').style.background = e.visita.color;
  $('fase').textContent = e.fase;
  $('tiempo').textContent = fmt(segundosActuales(e.tiempo));
  $('wrap').classList.toggle('oculto', !e.visible);

  const gl = String(e.local.goles), gv = String(e.visita.goles);
  if(ultimo.gL !== null && gl !== ultimo.gL) pop($('gL'));
  if(ultimo.gV !== null && gv !== ultimo.gV) pop($('gV'));
  $('gL').textContent = gl; $('gV').textContent = gv;
  ultimo = {gL:gl,gV:gv};
}
setInterval(pintar, 200);
pintar();
</script>
